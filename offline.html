<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Beard's Home Services</title>
  <meta name="theme-color" content="#1a3a5c">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/LOGO.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    :root { --primary:#1a3a5c; --accent:#e8a020; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Open Sans','Segoe UI',system-ui,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      padding:2rem; color:#2c2c2c;
      background:linear-gradient(135deg,#0f2540 0%,#1a3a5c 55%,#2a5a8c 100%);
    }
    .card {
      background:#fff; border-radius:12px; padding:2.5rem 1.75rem;
      max-width:420px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.3);
      border-top:4px solid var(--accent);
    }
    img { height:72px; width:auto; margin-bottom:1.25rem; }
    h1 { color:var(--primary); font-size:1.5rem; margin-bottom:0.75rem; }
    p { color:#555; margin-bottom:1.5rem; line-height:1.6; }
    .btn {
      display:inline-block; background:var(--accent); color:#fff;
      padding:0.85rem 1.75rem; border-radius:4px; text-decoration:none;
      font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
      border:none; cursor:pointer; font-size:1rem;
    }
    .btn.secondary { background:transparent; color:var(--primary); border:2px solid var(--primary); margin-top:0.75rem; }
    .phone { display:block; margin-top:1.5rem; color:var(--primary); font-weight:700; font-size:1.05rem; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/LOGO.png" alt="Beard's Home Services">
    <h1>You're Offline</h1>
    <p>Looks like you've lost your internet connection. You can still reach Brian directly by phone.</p>
    <a href="tel:+18703211072" class="btn">📞 Call (870) 321-1072</a>
    <button class="btn secondary" onclick="location.reload()">Try Again</button>
    <a href="tel:+18703211072" class="phone">Beard's Home Services · Mountain Home, AR</a>
  </div>
</body>
</html>
